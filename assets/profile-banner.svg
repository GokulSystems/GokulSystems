<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Gokul — AI and systems builder</title>
<desc id="desc">An animated midnight-blue banner with glowing neural connections, orbiting nodes, and the words Building intelligence through connection.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"/><stop offset=".55" stop-color="#0b1230"/><stop offset="1" stop-color="#160b2c"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#36e4ff"/><stop offset=".55" stop-color="#8374ff"/><stop offset="1" stop-color="#ff6bd6"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#44ddff" stop-opacity=".24"/><stop offset="1" stop-color="#44ddff" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="3.5"/></filter>
</defs>
<rect width="1200" height="320" rx="22" fill="url(#bg)"/>
<circle cx="960" cy="155" r="250" fill="url(#glow)"/>
<g fill="none" stroke="url(#line)" stroke-width="1.3" opacity=".55">
 <path d="M730 35 830 110 950 52 1080 110 1160 54"/><path d="M690 130 830 110 900 205 1080 110 1150 230"/>
 <path d="M730 35 690 130 760 255 900 205 950 52"/><path d="M760 255 1020 280 1150 230 1080 110"/>
 <path d="M830 110 1020 280"/><path d="M900 205 1160 54"/>
</g>
<g fill="#52eaff">
 <circle cx="730" cy="35" r="3"><animate attributeName="r" values="2;5;2" dur="3s" repeatCount="indefinite"/></circle>
 <circle cx="830" cy="110" r="4"><animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/></circle>
 <circle cx="950" cy="52" r="3"><animate attributeName="r" values="2;4.5;2" dur="2.6s" repeatCount="indefinite"/></circle>
 <circle cx="1080" cy="110" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/></circle>
 <circle cx="690" cy="130" r="3"/><circle cx="900" cy="205" r="4"><animate attributeName="r" values="2;5;2" dur="3.4s" repeatCount="indefinite"/></circle>
 <circle cx="760" cy="255" r="3"/><circle cx="1020" cy="280" r="3"/><circle cx="1150" cy="230" r="4"/>
</g>
<g fill="#bd86ff" opacity=".8"><circle cx="1160" cy="54" r="3"/><circle cx="950" cy="52" r="2"/><circle cx="830" cy="110" r="2"/></g>
<circle cx="900" cy="160" r="88" fill="none" stroke="#4be8ff" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="0 900 160" to="360 900 160" dur="28s" repeatCount="indefinite"/></circle>
<circle cx="900" cy="160" r="62" fill="none" stroke="#b17bff" stroke-opacity=".5" stroke-width="1.2"><animateTransform attributeName="transform" type="rotate" from="360 900 160" to="0 900 160" dur="19s" repeatCount="indefinite"/></circle>
<circle cx="900" cy="160" r="20" fill="#45dcff" opacity=".3" filter="url(#blur)"/>
<circle cx="900" cy="160" r="7" fill="#e4fcff"><animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/></circle>
<g font-family="Segoe UI,Arial,sans-serif">
 <text x="64" y="92" fill="#8beaff" font-size="17" letter-spacing="5">AI / ML  •  DISTRIBUTED SYSTEMS</text>
 <text x="60" y="164" fill="#ffffff" font-size="58" font-weight="700" letter-spacing="1">HEY, I'M GOKUL<tspan fill="#59e6ff">.</tspan></text>
 <text x="64" y="207" fill="#c6d5f5" font-size="21">Building intelligence through connection.</text>
 <path d="M64 237 H420" stroke="url(#line)" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 356;356 0;0 356" dur="6s" repeatCount="indefinite"/></path>
 <text x="64" y="272" fill="#8c9cbe" font-size="14" letter-spacing="2">LEARN  ·  BUILD  ·  EXPERIMENT  ·  REPEAT</text>
</g>
<g fill="#d5eaff"><circle cx="525" cy="45" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="630" cy="252" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle><circle cx="560" cy="112" r="1.3"/><circle cx="1140" cy="150" r="1.5"/></g>
</svg>